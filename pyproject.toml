[project]
name = "ids-steam"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mecab-python3>=1.0.12",
    "pandas>=3.0.5",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "unidic-lite>=1.0.8",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff.lint]
ignore = [
    "BLE001", # Do not catch blind exception
    "S110",   # try-except-pass
    "SIM102", # nested if
]

